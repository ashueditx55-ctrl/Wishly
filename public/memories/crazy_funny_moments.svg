<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Playful Background Gradient -->
    <linearGradient id="crazyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="40%" stop-color="#FCE7F3"/>
      <stop offset="80%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <!-- Rainbow / Confetti Gradients -->
    <linearGradient id="pinkPeach" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#FDA4AF" flood-opacity="0.3"/>
    </filter>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with playful polka dots -->
  <rect width="800" height="600" fill="url(#crazyBg)"/>

  <!-- Subtle Cute Polka Dot Pattern -->
  <g fill="#FBCFE8" opacity="0.35">
    <circle cx="80" cy="70" r="14"/><circle cx="220" cy="90" r="8"/><circle cx="360" cy="60" r="16"/>
    <circle cx="500" cy="80" r="10"/><circle cx="640" cy="70" r="18"/><circle cx="740" cy="110" r="12"/>
    <circle cx="120" cy="200" r="10"/><circle cx="700" cy="220" r="14"/><circle cx="60" cy="340" r="16"/>
    <circle cx="730" cy="350" r="12"/><circle cx="90" cy="480" r="14"/><circle cx="700" cy="490" r="16"/>
    <circle cx="200" cy="540" r="12"/><circle cx="600" cy="530" r="10"/>
  </g>

  <!-- Big Central Fun Glow -->
  <circle cx="400" cy="320" r="230" fill="#FFF" opacity="0.85" filter="url(#softGlow2)"/>

  <!-- Confetti Streamers & Ribbons -->
  <g opacity="0.85">
    <path d="M100 120 Q140 180 110 240 T130 300" stroke="#F43F5E" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="12 6"/>
    <path d="M680 100 Q650 160 690 220 T670 310" stroke="#FB7185" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="14 8"/>
    <path d="M220 50 Q280 90 260 140" stroke="#FBBF24" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M540 60 Q500 110 530 150" stroke="#34D399" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    
    <!-- Confetti Dots & Rectangles -->
    <rect x="180" y="160" width="14" height="7" rx="3" fill="#FB7185" transform="rotate(25 180 160)"/>
    <rect x="620" y="180" width="12" height="6" rx="3" fill="#38BDF8" transform="rotate(-30 620 180)"/>
    <rect x="250" y="240" width="16" height="8" rx="3" fill="#FBBF24" transform="rotate(45 250 240)"/>
    <rect x="580" y="250" width="14" height="7" rx="3" fill="#A855F7" transform="rotate(-15 580 250)"/>
    <rect x="160" y="320" width="12" height="6" rx="3" fill="#34D399" transform="rotate(60 160 320)"/>
    <rect x="640" y="330" width="15" height="7" rx="3" fill="#FB7185" transform="rotate(-40 640 330)"/>
  </g>

  <!-- Cute Sticker Elements around -->
  <!-- Boba Cup Sticker (Left) -->
  <g transform="translate(130, 230) rotate(-12)" filter="url(#stickerShadow)">
    <rect x="0" y="20" width="46" height="65" rx="10" fill="#FFFFFF" stroke="#F43F5E" stroke-width="3"/>
    <path d="M6 35 L40 35 L36 78 L10 78 Z" fill="#FED7AA"/>
    <!-- Boba Pearls -->
    <circle cx="16" cy="70" r="4" fill="#4C0519"/><circle cx="24" cy="72" r="4" fill="#4C0519"/><circle cx="32" cy="70" r="4" fill="#4C0519"/>
    <circle cx="20" cy="62" r="3.5" fill="#4C0519"/><circle cx="28" cy="62" r="3.5" fill="#4C0519"/>
    <!-- Straw -->
    <line x1="23" y1="20" x2="23" y2="4" stroke="#FB7185" stroke-width="5" stroke-linecap="round"/>
    <text x="23" y="52" font-family="'Caveat', cursive, sans-serif" font-size="14" font-weight="bold" fill="#E11D48" text-anchor="middle">BOBA</text>
  </g>

  <!-- Laughter Comic Speech Bubble (Right) -->
  <g transform="translate(580, 160) rotate(10)" filter="url(#stickerShadow)">
    <path d="M10 20 Q10 0 35 0 L115 0 Q140 0 140 20 L140 50 Q140 70 115 70 L50 70 L25 88 L32 70 L35 70 Q10 70 10 50 Z" fill="#FFFFFF" stroke="#FB7185" stroke-width="3"/>
    <text x="75" y="45" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#E11D48" text-anchor="middle">
      HAHAHA! 😂
    </text>
  </g>

  <!-- Mini Pizza Sticker (Bottom Left) -->
  <g transform="translate(140, 410) rotate(15)" filter="url(#stickerShadow)">
    <path d="M10 10 L60 25 L35 70 Z" fill="#FDE047" stroke="#EA580C" stroke-width="3"/>
    <circle cx="35" cy="35" r="4.5" fill="#DC2626"/>
    <circle cx="42" cy="48" r="4" fill="#DC2626"/>
    <circle cx="28" cy="45" r="3.5" fill="#DC2626"/>
    <!-- Crust -->
    <path d="M10 10 Q35 18 60 25" stroke="#D97706" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkling Star Sticker (Bottom Right) -->
  <g transform="translate(630, 420)" filter="url(#stickerShadow)">
    <path d="M30 0 L39 18 L58 22 L45 37 L48 56 L30 47 L12 56 L15 37 L2 22 L21 18 Z" fill="#FDE047" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="25" cy="24" r="2.5" fill="#FFF"/>
  </g>

  <!-- MAIN CHARACTERS: Two Cute Best Friends Laughing Joyfully (Central Focus) -->
  <g transform="translate(250, 170)" filter="url(#stickerShadow)">
    <!-- FRIEND 1: Left (Khushi) Laughing Joyfully with Bunny Ears Headband -->
    <!-- Bunny Ears -->
    <ellipse cx="90" cy="40" rx="10" ry="32" fill="#FFFFFF" stroke="#FB7185" stroke-width="3.5" transform="rotate(-15 90 40)"/>
    <ellipse cx="90" cy="40" rx="5" ry="20" fill="#FCE7F3" transform="rotate(-15 90 40)"/>
    <ellipse cx="130" cy="40" rx="10" ry="32" fill="#FFFFFF" stroke="#FB7185" stroke-width="3.5" transform="rotate(15 130 40)"/>
    <ellipse cx="130" cy="40" rx="5" ry="20" fill="#FCE7F3" transform="rotate(15 130 40)"/>
    <path d="M80 65 Q110 50 140 65" stroke="#FB7185" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <!-- Back Hair -->
    <ellipse cx="110" cy="120" rx="60" ry="58" fill="#4C0519"/>
    <!-- Cute Pigtails with Bows -->
    <circle cx="45" cy="115" r="24" fill="#4C0519"/>
    <circle cx="45" cy="100" r="7" fill="#FB7185"/>
    <!-- Face -->
    <ellipse cx="110" cy="125" rx="46" ry="44" fill="#FFEDD5"/>
    <!-- Front Bangs -->
    <path d="M72 105 Q110 85 148 105 Q135 125 110 115 Q85 125 72 105 Z" fill="#4C0519"/>

    <!-- Joyful Eyes (Happy Closed Crying with Laughter ^^) -->
    <path d="M86 122 Q96 112 106 122" stroke="#4C0519" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M116 122 Q126 112 136 122" stroke="#4C0519" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Cute Blush -->
    <ellipse cx="82" cy="132" rx="10" ry="6" fill="#FDA4AF" opacity="0.8"/>
    <ellipse cx="138" cy="132" rx="10" ry="6" fill="#FDA4AF" opacity="0.8"/>
    <!-- Laughing Mouth (Big Happy Smile Open) -->
    <path d="M96 135 Q111 155 126 135 Z" fill="#BE123C" stroke="#881337" stroke-width="2"/>
    <path d="M103 135 Q111 143 119 135" fill="#FFF"/>

    <!-- Outfit (Cute Pink Hoodie) -->
    <path d="M75 168 Q110 162 145 168 L160 250 Q110 260 60 250 Z" fill="#F43F5E"/>
    <circle cx="110" cy="205" r="14" fill="#FFF"/>
    <!-- Heart on Hoodie -->
    <path d="M110 200 C110 196 106 195 104 198 C102 195 98 196 98 200 C98 205 104 208 104 208 C104 208 110 205 110 200 Z" fill="#FB7185" transform="translate(6, 0) scale(1)"/>

    <!-- Peace Sign Hand (Left Friend) -->
    <g transform="translate(42, 170) rotate(-25)">
      <circle cx="15" cy="15" r="12" fill="#FFEDD5"/>
      <line x1="12" y1="10" x2="8" y2="-6" stroke="#FFEDD5" stroke-width="6" stroke-linecap="round"/>
      <line x1="18" y1="10" x2="22" y2="-6" stroke="#FFEDD5" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- FRIEND 2: Right (Best Friend) with Cute Cat Ears & Heart Glasses -->
    <!-- Cat Ears Headband -->
    <polygon points="175,60 190,25 208,60" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <polygon points="182,56 190,36 200,56" fill="#FEF3C7"/>
    <polygon points="232,60 250,25 265,60" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    <polygon points="240,56 250,36 258,56" fill="#FEF3C7"/>
    <path d="M185 64 Q220 52 255 64" stroke="#D97706" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Head & Hair -->
    <ellipse cx="220" cy="120" rx="58" ry="56" fill="#78350F"/>
    <circle cx="280" cy="115" r="24" fill="#78350F"/>
    <circle cx="280" cy="100" r="7" fill="#FBBF24"/>
    <!-- Face -->
    <ellipse cx="220" cy="125" rx="46" ry="44" fill="#FFEDD5"/>
    <path d="M182 105 Q220 88 258 105 Q245 125 220 115 Q195 125 182 105 Z" fill="#78350F"/>

    <!-- Funky Heart Sunglasses! -->
    <!-- Left Heart Glass -->
    <path d="M205 120 C205 113 197 111 193 116 C189 111 181 113 181 120 C181 129 193 134 193 134 C193 134 205 129 205 120 Z" fill="#F43F5E" stroke="#881337" stroke-width="2" transform="scale(1.2) translate(-36, -20)"/>
    <!-- Right Heart Glass -->
    <path d="M245 120 C245 113 237 111 233 116 C229 111 221 113 221 120 C221 129 233 134 233 134 C233 134 245 129 245 120 Z" fill="#F43F5E" stroke="#881337" stroke-width="2" transform="scale(1.2) translate(-42, -20)"/>
    <!-- Sunglasses Bridge -->
    <line x1="205" y1="122" x2="225" y2="122" stroke="#881337" stroke-width="3"/>

    <!-- Blush -->
    <ellipse cx="190" cy="134" rx="10" ry="6" fill="#FDA4AF" opacity="0.8"/>
    <ellipse cx="248" cy="134" rx="10" ry="6" fill="#FDA4AF" opacity="0.8"/>
    <!-- Wide Funny Grin -->
    <path d="M205 136 Q220 156 235 136 Z" fill="#BE123C" stroke="#881337" stroke-width="2"/>
    <path d="M212 136 Q220 144 228 136" fill="#FFF"/>

    <!-- Outfit (Pastel Mint Sweater) -->
    <path d="M185 168 Q220 162 255 168 L270 250 Q220 260 170 250 Z" fill="#34D399"/>
    <!-- Smiley Face on Sweater -->
    <circle cx="220" cy="205" r="14" fill="#FEF08A"/>
    <circle cx="216" cy="202" r="2" fill="#000"/>
    <circle cx="224" cy="202" r="2" fill="#000"/>
    <path d="M216 208 Q220 213 224 208" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Best Friends Hugging Each Other's Shoulder -->
    <path d="M140 175 Q165 160 190 175" stroke="#FB7185" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="165" cy="166" r="8" fill="#FFEDD5"/>
  </g>

  <!-- Sweet Sparkles & Floating Hearts -->
  <g fill="#FB7185" opacity="0.85">
    <path d="M385 120 C385 114 378 112 374 117 C370 112 363 114 363 120 C363 128 374 133 374 133 C374 133 385 128 385 120 Z" fill="#F43F5E" filter="url(#softGlow2)"/>
    <path d="M430 100 C430 95 425 93 422 97 C419 93 414 95 414 100 C414 106 422 110 422 110 C422 110 430 106 430 100 Z" fill="#FB7185"/>
  </g>

  <!-- Bottom Playful Banner: INSIDE JOKES FOREVER -->
  <g transform="translate(400, 520)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#FFFFFF" stroke="#FB7185" stroke-width="2.5" filter="url(#stickerShadow)"/>
    <text x="0" y="6" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="bold" fill="#E11D48" text-anchor="middle">
      ✨ 100% Chaos &amp; Pure Joy ✨
    </text>
  </g>

  <!-- Soft Pink Border -->
  <rect width="800" height="600" fill="none" stroke="#FBCFE8" stroke-width="3" opacity="0.4"/>
</svg>
